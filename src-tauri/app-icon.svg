<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <filter id="sh" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="10" dy="14" stdDeviation="12" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <filter id="base" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.22"/>
    </filter>
  </defs>
  <g filter="url(#base)">
    <g clip-path="url(#sq)">
      <rect x="512" y="100" width="412" height="412" fill="#00a3d9"/>
      <rect x="512" y="512" width="412" height="412" fill="#d6237a"/>
      <rect x="100" y="512" width="412" height="412" fill="#f2c200"/>
      <rect x="100" y="100" width="412" height="412" fill="#24272a"/>
    </g>
  </g>
  <rect x="306" y="306" width="378" height="446" rx="40" fill="#ffffff" filter="url(#sh)"/>
